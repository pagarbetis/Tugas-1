<body>
    <header>
        <div class="nav-container">
            <h2>Portofolio</h2>
            <button onclick="toggleMenu()">☰</button>

                <a href="Contact.html">Contact</a>

    <div class="container-contact">
        <h1>Kontak Saya</h1>
        <form action="" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter Your Email" autocomplete="email" required/>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" cols="30" rows="10" name="message" placeholder="Type Your Message" required></textarea>
            </div>
            <div class="button-group">
                <button type="submit">Kirim</button>
            </div>
        </form>
    </div>
            <footer class="footer">
        <div class="footer-container">
            <p>&copy; <span id="year"></span> Portofolio Andi Angga Krismona P.</p>
        </div>
    </footer>
        <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.classList.toggle('tampil');
        }
        </script>
</body>
</html>
